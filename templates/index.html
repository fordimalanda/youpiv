{% load static %}
<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>YouTube Downloader</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head>
<body><main class="card"><div class="brand">▶</div><h1>YouTube Downloader</h1><p class="subtitle">Téléchargez une vidéo YouTube</p><form id="download-form">{% csrf_token %}<label for="youtube-url">URL de la vidéo</label><input id="youtube-url" name="url" type="url" placeholder="https://www.youtube.com/watch?v=..." required autocomplete="url"><button id="download-button" type="submit">Télécharger</button></form><section id="status" class="status" aria-live="polite" hidden><p id="status-text">Préparation du téléchargement…</p><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="bar-fill"></div></div><strong id="percent">0%</strong><p id="details" class="details"></p></section><p id="error" class="error" role="alert"></p><p class="notice">Téléchargez uniquement les contenus pour lesquels vous disposez des droits nécessaires.</p></main><script src="{% static 'js/app.js' %}"></script></body></html>
