name: 🐛 Bug Report
description: Create a report to help us fix a bug or issue.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci d'avoir pris le temps de signaler un problème !

  - type: textarea
    id: description
    attributes:
      label: Description du problème
      description: Une description claire et concise du problème rencontré.
      placeholder: Quel est le problème ?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Quelles sont les étapes pour reproduire le bug ?
      placeholder: |
        1. Allez sur '...'
        2. Collez l'URL '...'
        3. Cliquez sur 'Télécharger'
        4. Observez l'erreur
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Ce que vous vous attendiez à voir se produire.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Captures d'écran
      description: Ajoutez ici des captures d'écran ou des journaux d'erreurs Docker / Django si vous en avez.
      render: shell
    validations:
      required: false
