name: Security Analysis

on:
  push:
    branches: [ "main", "master", "refactor/dowmload" ]
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  security-scan:
    name: Code & Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Run Bandit (Code Security Linter)
        run: |
          # Scan project source files for security vulnerabilities
          bandit -r downloader/ manage.py -ll

      - name: Run Pip Audit (Dependency Vulnerability Scan)
        run: |
          # Scan dependencies for known CVEs
          pip-audit -r requirements.txt
